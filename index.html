<style>
:root {
  --bg-app: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --border-subtle: #f1f5f9;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --accent: #0f172a;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
  --shadow-md: 0 4px 16px -2px rgb(0 0 0 / 0.05);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header Ultra Minimal */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 48px 24px 32px;
  text-align: center;
}

header h1 {
  margin: 0 0 24px;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-main);
}

/* Search Bar Clean */
.search-wrapper {
  max-width: 580px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
}

.search-input {
  flex: 1;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-app);
  color: var(--text-main);
  font-size: 0.9rem;
  outline: none;
  transition: all 0.2s ease;
}

.search-input:focus {
  background: var(--surface);
  border-color: var(--text-main);
  box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
}

.select-input {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-app);
  color: var(--text-muted);
  font-size: 0.88rem;
  font-weight: 500;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.select-input:focus {
  border-color: var(--text-main);
}

/* Minimal Stats Indicator */
.stats-bar {
  display: inline-flex;
  gap: 24px;
  margin-top: 28px;
  padding: 8px 20px;
  background: var(--bg-app);
  border-radius: 40px;
  border: 1px solid var(--border);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.stat-item strong {
  color: var(--text-main);
  font-weight: 700;
}

/* Main Content */
main {
  max-width: 1140px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* Minimal Pills Filter */
.chips-nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 36px;
}

.chip-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  padding: 7px 16px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.chip-btn:hover {
  background: rgba(0, 0, 0, 0.03);
  color: var(--text-main);
}

.chip-btn.active {
  background: var(--surface);
  color: var(--text-main);
  border-color: var(--border);
  box-shadow: var(--shadow-sm);
  font-weight: 600;
}

/* Sections */
.section-block {
  margin-bottom: 48px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.badge-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  color: #ffffff;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
}

.section-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-main);
  margin: 0;
}

.group-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  color: var(--text-light);
  margin: 24px 0 12px;
}

/* Clean Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 18px;
}

.card-item {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 22px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.card-item:hover {
  border-color: #cbd5e1;
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.card-title {
  margin: 0 0 16px;
  font-size: 1.02rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-main);
}

/* Course Rows */
.course-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.course-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--bg-app);
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  color: var(--text-main);
}

.btn-download {
  background: var(--text-main);
  color: #ffffff;
  text-decoration: none;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
  transition: opacity 0.2s ease;
}

.btn-download:hover {
  opacity: 0.85;
}

.tag-soon {
  color: var(--text-light);
  font-size: 0.75rem;
  font-weight: 500;
  padding: 4px 8px;
}

footer {
  text-align: center;
  padding: 32px 24px;
  color: var(--text-light);
  font-size: 0.82rem;
  border-top: 1px solid var(--border);
}

.empty-state {
  text-align: center;
  background: var(--surface);
  border: 1px dashed var(--border);
  padding: 56px 24px;
  border-radius: var(--radius-lg);
  color: var(--text-muted);
}
</style>
